services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    ports:
      - "3003:8000"
    volumes:
      - /mnt/dokploy/paperless/data:/usr/src/paperless/data
      - /mnt/dokploy/paperless/export:/usr/src/paperless/export
      - /mnt/dokploy/paperless/hooks:/usr/src/paperless/scripts
      - /mnt/dokploy/paperless/trash:/usr/src/paperless/trash
      - type: bind
        source: /mnt/media/Paperless/consume
        target: /usr/src/paperless/consume
      - type: bind
        source: /mnt/media/Paperless
        target: /usr/src/paperless/media
    environment:
      PAPERLESS_ALLOWED_HOSTS: $HOSTS
      PAPERLESS_URL: $DOMAIN
      PAPERLESS_SECRET_KEY: $PAPERLESS_SECRET_KEY
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: $PG_HOST
      PAPERLESS_DBPASS: $PG_PW
      PAPERLESS_DBUSER: $PG_USER
      PAPERLESS_DBNAME: paperless
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_ADMIN_USER: $ADMIN
      PAPERLESS_ADMIN_MAIL: $ADMIN_EMAIL
      PAPERLESS_ADMIN_PASSWORD: $ADMIN_PW
      PAPERLESS_EMAIL_HOST: $SMTP_HOST
      PAPERLESS_EMAIL_PORT: $SMTP_PORT
      PAPERLESS_EMAIL_HOST_USER: $SMTP_USER
      PAPERLESS_EMAIL_FROM: $FROM
      PAPERLESS_EMAIL_HOST_PASSWORD: $SMTP_KEY
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_USE_X_FORWARD_PORT: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_ENABLE_UPDATE_CHECK: "true"
      PAPERLESS_OCR_LANGUAGES: deu eng fra
      PAPERLESS_OCR_LANGUAGE: deu
      OCR_SKIP_TEXT: "false"
      PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
      PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: "true"
      PAPERLESS_CONSUMER_BARCODE_SCANNER: ZXING
      PAPERLESS_FILENAME_FORMAT: "{{ created_year }}/{{ correspondent }}/{{ title }}"
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      # Enable the allauth ecosystem and the OIDC provider backend
      PAPERLESS_ENABLE_ALLAUTH: "true"
      PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"

      # Supply the OIDC JSON configuration
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: $PAPERLESS_SOCIALACCOUNT_PROVIDERS

      ## Paperless AI
      PAPERLESS_AI_ENABLED: "true"
      #
      ## Main LLM - LM Studio
      PAPERLESS_AI_LLM_BACKEND: "openai-like"
      PAPERLESS_AI_LLM_ENDPOINT: $LM_STUDIO_BASE_URL
      PAPERLESS_AI_LLM_API_KEY: $LM_STUDIO_API_TOKEN
      PAPERLESS_AI_LLM_MODEL: $LM_STUDIO_MAIN_MODEL
      #
      ## AI output
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: "German"
      PAPERLESS_AI_LLM_CONTEXT_SIZE: "16384"
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "120"
      #
      ## RAG embeddings - also LM Studio
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "openai-like"
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: $LM_STUDIO_BASE_URL
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: $LLM_EMBEDDING_MODEL
      PAPERLESS_AI_LLM_EMBEDDING_API_KEY: $LM_STUDIO_API_TOKEN
      #
      ## RAG
      PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE: "1024"
      #
      ## Allow the private 192.168.x.x LM Studio endpoint
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"
    depends_on:
      - gotenberg
      - tika
      - redis
    networks:
      - services

  gotenberg:
    image: docker.io/gotenberg/gotenberg:latest
    container_name: gotenberg
    restart: unless-stopped

    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    networks:
      - services

  tika:
    image: docker.io/apache/tika:latest
    container_name: tika
    restart: unless-stopped
    networks:
      - services

  redis:
    container_name: redis
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - /mnt/dokploy/paperless/redis:/data
    networks:
      - services

networks:
  services:
    external: true