apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    # Add your services here, e.g.:
    # - Services:
    #     - Home Assistant:
    #         href: https://ha.example.com
    #         icon: home-assistant.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
